version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ''
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - opas-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/opas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_ACCESS_SECRET=your_super_secret_access_key_here_32c
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key_here_32
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - opas-network
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - opas-network
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - opas-network
    restart: unless-stopped

volumes:
  mongodb-data:
  redis-data:

networks:
  opas-network:
    driver: bridge
