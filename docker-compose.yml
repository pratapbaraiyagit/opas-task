version: '3.8'

services:
  # The frontend React application served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - opas-network
    restart: unless-stopped

  # The backend Node.js API and Socket.IO server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/opas
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=your_super_secret_access_key_here
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key_here
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - opas-network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - opas-network
    restart: unless-stopped

  # Redis for Socket.IO scaling
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - opas-network
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  mongodb-data:
  redis-data:

# Internal network for the services to communicate
networks:
  opas-network:
    driver: bridge
